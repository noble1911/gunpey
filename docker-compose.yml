# On the home server: `docker compose up -d --build` from ~/gunpey.
# Played at games.noblehaus.uk/gunpey/ (through the games gateway) or http://192.168.1.117:3003/ on the LAN.
services:
  gunpey:
    build: .
    container_name: gunpey
    ports:
      - "3003:3000"
    networks:
      - homeserver
    restart: unless-stopped

networks:
  homeserver:
    external: true
